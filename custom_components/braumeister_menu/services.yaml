navigate:
  name: Navigate the Braumeister menu
  description: Queue one local menu action and wait for the bridge result.
  fields:
    action:
      name: Menu action
      required: true
      selector:
        select:
          options:
            - open_settings
            - close_settings
            - open_manual
            - close_manual
            - open_recipe_list
            - close_recipe_list
            - open_recipe_selection
            - cancel_recipe_selection
            - recipe_down
            - recipe_up
            - select_recipe
            - open_temperature_editor
            - temperature_up
            - temperature_down
            - confirm_temperature
            - cancel_temperature
program_control:
  name: Control an evidenced Braumeister program transition
  description: Control verified program and delayed-start transitions. Delayed-start confirmation requires Bridge program control and remote heating permissions.
  fields:
    action:
      name: Program action
      required: true
      selector:
        select:
          options:
            - request_program_pause
            - abort_program
            - resume_program
            - start_delay_up
            - start_delay_down
            - confirm_start_delay
            - start_now
            - cancel_water_prompt
            - cancel_start_delay
set_actuator:
  name: Set a manual Braumeister actuator
  description: Request one pump or heater action and wait for the bridge result.
  fields:
    action:
      name: Actuator action
      required: true
      selector:
        select:
          options:
            - pump_on
            - pump_off
            - heater_on
            - heater_off
get_recipe_picker:
  name: Read recipe selection
  description: Reads the existing Bridge status and recipe list without sending a device command.
