navigate:
  name: Navigate the Braumeister menu
  description: Queue one local menu action and wait for the bridge result.
  fields:
    action:
      name: Menu action
      required: true
      selector:
        select:
          options:
            - open_settings
            - close_settings
            - open_manual
            - close_manual
            - open_recipe_list
            - close_recipe_list
            - open_recipe_selection
            - cancel_recipe_selection
            - recipe_down
            - recipe_up
set_actuator:
  name: Set a manual Braumeister actuator
  description: Request one pump or heater action and wait for the bridge result.
  fields:
    action:
      name: Actuator action
      required: true
      selector:
        select:
          options:
            - pump_on
            - pump_off
            - heater_on
            - heater_off
